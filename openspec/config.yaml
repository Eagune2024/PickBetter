# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  ## 项目概述
  PickBetter 是一个基于 WebExtension API 的跨浏览器扩展项目,支持 Chrome、Firefox、Opera、Edge 等浏览器。

  ## 技术栈
  - **前端框架**: React 19 (自动 JSX runtime)
  - **语言**: TypeScript 5.9
  - **构建工具**: Vite 7
  - **样式**: SCSS + CSS Modules
  - **代码规范**: ESLint 9 (flat config) + Prettier
  - **浏览器 API**: webextension-polyfill
  - **Manifest**: Vite 3 (跨浏览器兼容)

  ## 核心架构
  项目采用消息驱动的架构模式:

  - **Background Script**: Service Worker (Chrome) / Background Script (Firefox),作为中央消息路由和状态管理器
  - **Content Script**: 注入到网页的脚本,必须打包为 IIFE (不支持 ES Module)
  - **Popup**: 用户交互主界面,通过 browser.tabs.sendMessage 与 Content Script 通信,通过 browser.runtime.sendMessage 与 Background 通信
  - **Options**: 用户设置页面,直接访问 browser.storage.local
  - **Storage**: 使用 browser.storage.local 进行持久化存储,通过 TypeScript 接口定义 Schema 确保类型安全

  ## 消息通信模式
  - 所有消息类型在 `source/types/messages.ts` 中定义,使用 TypeScript 联合类型确保类型安全
  - Content Script → Background: 页面访问通知 (PAGE_VISITED)
  - Popup → Content Script: 查询页面信息 (GET_PAGE_INFO / PAGE_INFO_RESPONSE)
  - Popup → Background: 查询全局状态 (GET_VISIT_COUNT / VISIT_COUNT_RESPONSE)

  ## 编码规范
  - 使用 `interface` 定义对象类型,使用 `type` 定义联合类型
  - 函数组件使用 `FC` 类型显式声明
  - 所有组件样式使用 CSS Modules (.module.scss)
  - 导入顺序: React → 第三方库 → 内部模块 (@/) → 类型 → 样式
  - 异步操作使用 async/await,避免 Promise 链
  - 存储操作使用类型安全的工具函数 (`utils/storage.ts`)
  - 消息通信使用类型断言 + 类型检查

  ## 开发工作流
  ```bash
  npm run dev:chrome    # Chrome 开发模式 (文件变化自动重建)
  npm run dev:firefox   # Firefox 开发模式
  npm run build:chrome  # Chrome 生产构建
  npm run build:firefox # Firefox 生产构建
  npm run lint          # ESLint 检查
  npm run lint:fix      # 自动修复
  ```

  ## 目录结构
  - `source/Background/`: 后台脚本
  - `source/ContentScript/`: 内容脚本 (IIFE)
  - `source/Popup/`: 弹出窗口
  - `source/Options/`: 选项页面
  - `source/components/`: 共享 React 组件
  - `source/types/`: TypeScript 类型定义
  - `source/utils/`: 工具函数
  - `source/styles/`: 全局样式 (_variables.scss, _reset.scss, _fonts.scss)
  - `source/public/`: 静态资源 (图标等)

  ## 跨浏览器兼容性
  - 使用 vendor 前缀在 manifest.json 中定义浏览器特定配置
  - Content Script 必须打包为 IIFE (通过 vite 自定义插件)
  - Chrome 和 Firefox 都支持 ES Module (Firefox 112+)

  ## 构建输出
  - `extension/chrome/`: Chrome 扩展构建产物
  - `extension/firefox/`: Firefox 附加组件构建产物
  - 每个构建包含 manifest.json、HTML、JS bundles、CSS、静态资源

  ## 相关文档
  - 架构规格: `openspec/specs/architecture/spec.md`
  - 编码规范: `openspec/specs/coding-standards/spec.md`

